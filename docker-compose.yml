name: polysignal_intelligence

services:
  polysignal_app:
    build: .
    container_name: polysignal_app
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://polysignal_user:${POSTGRES_PASSWORD}@polysignal_postgres:5432/polysignal_intelligence
      REDIS_URL: redis://polysignal_redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      polysignal_postgres:
        condition: service_healthy
      polysignal_redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).status < 500 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - polysignal_network

  polysignal_postgres:
    image: postgres:16-alpine
    container_name: polysignal_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: polysignal_intelligence
      POSTGRES_USER: polysignal_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - polysignal_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U polysignal_user -d polysignal_intelligence"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - polysignal_network

  polysignal_redis:
    image: redis:7-alpine
    container_name: polysignal_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - polysignal_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - polysignal_network

volumes:
  polysignal_pgdata:
    name: polysignal_pgdata
  polysignal_redisdata:
    name: polysignal_redisdata

networks:
  polysignal_network:
    name: polysignal_network
